name: CI

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build win-x64
        run: dotnet build src/DivoomPcMonitor.App/DivoomPcMonitor.App.csproj -c Release -r win-x64 --nologo

      - name: Build win-arm64
        run: dotnet build src/DivoomPcMonitor.App/DivoomPcMonitor.App.csproj -c Release -r win-arm64 --nologo

      - name: Test
        run: dotnet test tests/DivoomPcMonitor.Tests/DivoomPcMonitor.Tests.csproj -c Release --nologo

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read the tag version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag
          if ($version.StartsWith("v") -or $version.StartsWith("V")) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch "^\d+\.\d+\.\d+([-+].*)?$") {
            throw "Tag '$tag' is not a version like v0.1.0."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append

      - name: Publish
        shell: pwsh
        run: ./publish.ps1 -Runtime ${{ matrix.rid }} -Version "${{ steps.version.outputs.version }}" -SkipTest

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          name: DivoomPcMonitor-${{ matrix.rid }}
          path: dist/DivoomPcMonitor-*-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Attach the builds to the tag
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the zips
        uses: actions/download-artifact@v8
        with:
          pattern: DivoomPcMonitor-*
          path: release
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $zips = @(Get-ChildItem -Path release -Filter *.zip | Sort-Object Name)
          if ($zips.Count -lt 2) { throw "Expected both Windows zips. Found $($zips.Count)." }
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $sums = Join-Path (Resolve-Path release) "SHA256SUMS.txt"
          $lines = foreach ($zip in $zips) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $zip.Name
          }
          [System.IO.File]::WriteAllText($sums, (($lines -join "`n") + "`n"), $utf8)
          $files = @($zips.FullName) + $sums
          gh release view $tag --repo $env:GH_REPO --json tagName
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --repo $env:GH_REPO --clobber
          } else {
            gh release create $tag @files --repo $env:GH_REPO --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
